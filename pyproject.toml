[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradinglab"
version = "0.1.0"
description = "Laboratorio de investigación de estrategias de trading sobre criptomonedas (sin dinero real)"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
include = ["tradinglab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
