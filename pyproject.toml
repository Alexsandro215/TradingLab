[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradinglab"
version = "0.1.0"
description = "Laboratorio de investigación de estrategias de trading sobre criptomonedas (sin dinero real)"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",           # fase 1: API REST de Binance
    "numpy>=1.26",              # fase 2: motor de backtest
    "pandas>=2.1",              # fase 2: indicadores de las estrategias
    "fastapi>=0.110",           # fase 4: panel web
    "uvicorn[standard]>=0.29",  # fase 4: servidor del panel
    "websockets>=13",           # fase 5: datos en vivo
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",  # cliente de pruebas de FastAPI
]

[tool.setuptools.packages.find]
include = ["tradinglab*"]

[tool.setuptools.package-data]
"tradinglab.panel" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Aviso de Starlette sobre el cliente de pruebas de FastAPI; no afecta al proyecto.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`:UserWarning"]
